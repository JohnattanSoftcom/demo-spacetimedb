# Static Angular app. `/v1` never reaches this server: Traefik routes it to SpacetimeDB.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The router uses real paths (/supervision, /chauffeur, /arret/5): unknown paths fall back
    # to index.html and Angular takes over.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Always revalidate the entry point, so a new deployment is picked up on the next load.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Build output is content-hashed (outputHashing: all): safe to cache for good.
    location ~* \.(?:js|css|woff2?|png|svg|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
