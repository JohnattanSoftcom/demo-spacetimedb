@if (!kiosk()) {
  <header class="sticky top-0 z-[1500] border-b border-slate-800 bg-slate-900 text-white">
    <div class="flex h-12 items-center gap-3 px-3 sm:px-4">
      <a routerLink="/" class="flex items-center gap-2 font-bold tracking-tight whitespace-nowrap">
        <span class="grid size-7 place-items-center rounded-md bg-red-600 text-sm" aria-hidden="true">TV</span>
        <span>TransVille <span class="text-red-400">Live</span></span>
      </a>
      <nav class="flex min-w-0 flex-1 items-center gap-1 overflow-x-auto text-sm" aria-label="Navigation principale">
        @for (l of links; track l.path) {
          <a
            [routerLink]="l.path"
            routerLinkActive="bg-white/15 text-white"
            [routerLinkActiveOptions]="{ exact: l.exact }"
            class="rounded-md px-2.5 py-1 whitespace-nowrap text-white/70 hover:bg-white/10 hover:text-white"
            >{{ l.label }}</a
          >
        }
      </nav>
      <app-connection-badge [dark]="true" />
      @if (stdb.me(); as me) {
        <span class="hidden text-xs text-white/70 md:inline">{{ me.name }}</span>
      }
      <button
        type="button"
        class="hidden rounded-md px-2 py-1 text-xs text-white/60 hover:bg-white/10 hover:text-white sm:inline"
        title="Oublier l'identité de cet onglet et en créer une nouvelle"
        (click)="stdb.newIdentity()"
      >
        Nouvelle identité
      </button>
    </div>
  </header>
}
<main>
  <router-outlet />
</main>
<app-toast-host />
